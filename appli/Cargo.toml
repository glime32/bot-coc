[package]
name = "bot-coc-appli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "bot-coc"
path = "src/main.rs"

[dependencies]
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_full"] }
libc = "0.2"

[build-dependencies]
cxx-qt-build = "0.10"

[profile.release]
opt-level = "s"
lto = "thin"
strip = true
